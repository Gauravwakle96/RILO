services:
  rilo:
    build:
      context: .
      dockerfile: Dockerfile
    image: rilo:0.2.0
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8018:8018"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.hosted
    volumes:
      - rilo-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8018/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rilo-data:
