[project]
name = "rilo"
version = "0.1.0"
description = "Local, reproducible reliability testing for AI agents"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.38,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "langgraph>=1.0,<2",
  "pypdf>=6,<7",
  "reportlab>=4,<5",
  "defusedxml>=0.7,<1",
  "certifi>=2026.2.25",
]

[project.scripts]
rilo = "rilo.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "pytest-cov>=7,<8", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/rilo"]

[tool.pytest.ini_options]
testpaths = ["tests/backend", "tests/developer"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["backend/rilo"]
check_untyped_defs = true
ignore_missing_imports = true

